<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fdfcf9"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">teach-ja: how a session works / セッションの仕組み</text>

  <!-- left: skill folder -->
  <rect x="15" y="70" width="300" height="300" rx="12" fill="#f3f1ec" stroke="#d8d3c8"/>
  <text x="165" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Skill folder（読み取り専用）</text>
  <text x="165" y="118" text-anchor="middle" font-size="12" fill="#5b636d">skills/teach-ja/</text>
  <g font-size="12.5" fill="#1f2328">
    <text x="35" y="150">SKILL.md — 指示の本体</text>
    <text x="35" y="176">JAPANESE-GUIDE.md — 日本語ルール</text>
    <text x="35" y="202">MISSION-FORMAT.md</text>
    <text x="35" y="228">RESOURCES-FORMAT.md</text>
    <text x="35" y="254">GLOSSARY-FORMAT.md</text>
    <text x="35" y="280">LEARNING-RECORD-FORMAT.md</text>
    <text x="35" y="306">starter-assets/style.css</text>
    <text x="35" y="332">starter-assets/quiz.js</text>
  </g>

  <!-- middle: agent -->
  <rect x="345" y="150" width="270" height="140" rx="14" fill="#b5482b"/>
  <text x="480" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Claude Code</text>
  <text x="480" y="214" text-anchor="middle" font-size="13" fill="#fff">/teach-ja を実行</text>
  <text x="480" y="240" text-anchor="middle" font-size="12" fill="#fde9e2">1. 言語・ミッション・記録を読む</text>
  <text x="480" y="260" text-anchor="middle" font-size="12" fill="#fde9e2">2. 次に教えることを決める</text>
  <text x="480" y="280" text-anchor="middle" font-size="12" fill="#fde9e2">3. レッスンを作り、記録を更新</text>

  <!-- user -->
  <rect x="380" y="70" width="200" height="50" rx="25" fill="#fff" stroke="#b5482b" stroke-width="2"/>
  <text x="480" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#b5482b">学習者 (You)</text>
  <line x1="465" y1="120" x2="465" y2="148" stroke="#5b636d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="495" y1="148" x2="495" y2="122" stroke="#5b636d" stroke-width="2" marker-end="url(#a)"/>
  <text x="455" y="140" text-anchor="end" font-size="11" fill="#5b636d">質問・回答</text><text x="505" y="140" font-size="11" fill="#5b636d">面談・クイズ</text>

  <line x1="317" y1="220" x2="342" y2="220" stroke="#5b636d" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#5b636d">読む</text>

  <!-- right: workspace memory -->
  <rect x="645" y="70" width="300" height="300" rx="12" fill="#fff" stroke="#b5482b" stroke-width="2"/>
  <text x="795" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Workspace = 記憶</text>
  <text x="795" y="118" text-anchor="middle" font-size="12" fill="#5b636d">/teach-ja を実行したフォルダ</text>
  <g font-size="12.5" fill="#1f2328">
    <text x="665" y="150">NOTES.md — 言語・文体・好み</text>
    <text x="665" y="176">MISSION.md — なぜ学ぶか</text>
    <text x="665" y="202">RESOURCES.md — 信頼できる情報源</text>
    <text x="665" y="228">GLOSSARY.md — 用語の正しい表記</text>
    <text x="665" y="254">learning-records/ — 習得の記録</text>
    <text x="665" y="280">lessons/ — HTMLレッスン</text>
    <text x="665" y="306">reference/ — 早見表</text>
    <text x="665" y="332">assets/ — 共通CSS・クイズ部品</text>
  </g>
  <line x1="617" y1="205" x2="642" y2="205" stroke="#5b636d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="642" y1="240" x2="619" y2="240" stroke="#5b636d" stroke-width="2" marker-end="url(#a)"/>
  <text x="630" y="196" text-anchor="middle" font-size="11" fill="#5b636d">書く</text>
  <text x="630" y="258" text-anchor="middle" font-size="11" fill="#5b636d">読む</text>

  <!-- bottom: session loop -->
  <rect x="30" y="400" width="900" height="130" rx="12" fill="#f6e7e1"/>
  <text x="480" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Memory lives in files, not in the chat / 記憶は会話ではなく、ファイルに残る</text>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <rect x="55" y="448" width="190" height="60" rx="8" fill="#fff"/><text x="150" y="473">セッション1</text><text x="150" y="494" font-size="11" fill="#5b636d">面談 → MISSION / 最初のレッスン</text>
    <rect x="285" y="448" width="190" height="60" rx="8" fill="#fff"/><text x="380" y="473">クイズ・質問</text><text x="380" y="494" font-size="11" fill="#5b636d">理解の証拠 → learning-record</text>
    <rect x="515" y="448" width="190" height="60" rx="8" fill="#fff"/><text x="610" y="473">会話を閉じる</text><text x="610" y="494" font-size="11" fill="#5b636d">チャット履歴は消えてもOK</text>
    <rect x="745" y="448" width="160" height="60" rx="8" fill="#fff"/><text x="825" y="473">新しいセッション</text><text x="825" y="494" font-size="11" fill="#5b636d">「次のレッスン」で続きから</text>
  </g>
  <g stroke="#5b636d" stroke-width="2" marker-end="url(#a)"><line x1="247" y1="478" x2="282" y2="478"/><line x1="477" y1="478" x2="512" y2="478"/><line x1="707" y1="478" x2="742" y2="478"/></g>
</svg>
